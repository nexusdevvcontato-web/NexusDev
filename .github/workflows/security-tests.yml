name: Backend security tests

on:
  push:
    branches:
      - rebuild/v2-security
  pull_request:
    branches:
      - rebuild/v2-security

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Run syntax and security tests
        run: npm test
